# Temporary: builds an AppImage on Ubuntu 26.04 so it can be tested on a 26.04 host before the
# release pipeline is committed to producing one. The published AppImage is built on 24.04 and
# aborts on Ubuntu 26 (bundled WebKitGTK against a much newer host EGL); whether matching the
# base fixes that is a question only a real 26.04 host can answer. Deleted either way.
name: Probe Ubuntu 26 AppImage

on:
  push:
    branches: ["claude/**"]

jobs:
  build-appimage-ubuntu26:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # Same list as release.yml's Linux job. Reported individually rather than as one
      # apt-get line so a package that was renamed or dropped in 26.04 is obvious from the log
      # instead of failing the whole step with no detail.
      - name: Check the build dependencies exist on this image
        run: |
          sudo apt-get update
          for pkg in libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev build-essential curl wget file \
                     libxdo-dev libayatana-appindicator3-dev patchelf; do
            cand=$(apt-cache policy "$pkg" 2>/dev/null | sed -n 's/^  Candidate: //p')
            echo "${pkg}: ${cand:-MISSING}"
          done

      - name: Install build dependencies
        run: |
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev build-essential curl wget file \
            libxdo-dev libayatana-appindicator3-dev patchelf

      - uses: ./.github/actions/verify

      - name: Build server sidecar
        run: ./packaging/linux/build-sidecar.sh

      - name: Build the AppImage
        run: npx tauri build --bundles appimage

      # Named so it can never be confused with the 24.04 one: the two are not interchangeable,
      # an AppImage built here won't run on an older host at all.
      - name: Label it with the base it was built on
        run: |
          cd src-tauri/target/release/bundle/appimage
          for f in *.AppImage; do mv "$f" "${f%.AppImage}-ubuntu26.AppImage"; done
          ls -la

      - name: Report what it ended up bundling
        run: |
          cd src-tauri/target/release/bundle/appimage
          ./*-ubuntu26.AppImage --appimage-extract > /dev/null
          echo "bundled libs: $(ls squashfs-root/usr/lib/*.so* | wc -l)"
          ls -la squashfs-root/usr/lib/libgio-2.0.so.0* squashfs-root/usr/lib/libglib-2.0.so.0* 2>/dev/null || true
          echo "--- gio modules in the bundle ---"
          ls squashfs-root/usr/lib/x86_64-linux-gnu/gio/modules/ 2>/dev/null || echo "(none)"

      - uses: actions/upload-artifact@v7
        with:
          name: minigit2-appimage-ubuntu26
          path: src-tauri/target/release/bundle/appimage/*.AppImage
