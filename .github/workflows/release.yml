name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Override the release tag (e.g. v0.2.0-hotfix). Leave empty to use "v" + the version
          from package.json — the normal way to cut a release: bump package.json, merge, then
          run this workflow.
        required: false

jobs:
  build-appimage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libayatana-appindicator3-dev \
            patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm run test

      - name: Build server and client
        run: npm run build

      - name: Build server sidecar
        run: ./packaging/linux/build-sidecar.sh

      - name: Build Tauri AppImage
        run: npx tauri build

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: minigit2-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage

      # A real tag push already names itself; a manual dispatch uses its own override input if
      # given, otherwise "v" + package.json's version — package.json is the single source of
      # truth for the app's version (tauri.conf.json reads it from the same file at build time).
      - name: Determine release tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach AppImage to release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          # This creates the tag (pointing at the triggering commit) as part of creating the
          # release when it doesn't already exist — the runner's own token can do this even when
          # a contributor's own git credentials aren't allowed to push tags directly.
          tag_name: ${{ steps.version.outputs.tag }}
          files: src-tauri/target/release/bundle/appimage/*.AppImage
