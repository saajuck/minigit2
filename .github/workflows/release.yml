name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Override the release tag (e.g. v0.2.0-hotfix). Leave empty to use "v" + the version
          from package.json — the normal way to cut a release: bump package.json, merge, then
          run this workflow.
        required: false

jobs:
  # Shared across both build jobs so they always attach to the exact same tag/release rather
  # than each recomputing it independently — a pure function of the same inputs either way, but
  # one source of truth is one less thing to keep in sync as this file changes.
  determine-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Determine release tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            version=$(grep -m1 '"version"' package.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi

  # One Linux build per base, because an AppImage carries its own WebKitGTK and GLib and those
  # only work on a host no older than the base they were built on. The 24.04 AppImage aborts on
  # Ubuntu 26 before opening a window ("Could not create surfaceless EGL display: EGL_BAD_ALLOC"),
  # and no environment variable avoids it — the bundled WebKitGTK is simply talking to a much
  # newer host EGL. Building a second one on 26.04 fixes that, verified on a real 26.04 desktop.
  # The two are not interchangeable in either direction, hence the suffix in the filename.
  #
  # `ubuntu-latest` is deliberately not used here: the day GitHub points it at a newer image, the
  # AppImage meant for older hosts would silently stop covering them, which is exactly the bug
  # this matrix exists to prevent.
  build-linux:
    needs: determine-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          # The native packages come from the oldest supported base only: they link against the
          # host's own libraries, so one build serves every newer distribution too (its declared
          # dependencies carry no version bound), and two legs producing identically-named .deb
          # files would collide on the release.
          - base: ubuntu-24.04
            suffix: ""
            bundles: "appimage,deb,rpm"
            release_files: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
          - base: ubuntu-26.04
            suffix: "-ubuntu26"
            bundles: "appimage"
            release_files: src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.base }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libayatana-appindicator3-dev \
            patchelf

      - uses: ./.github/actions/verify

      - name: Build server sidecar
        run: ./packaging/linux/build-sidecar.sh

      - name: Build Tauri bundles
        run: npx tauri build --bundles ${{ matrix.bundles }}

      # Without this the two bases produce the same filename and the second to finish would
      # overwrite the first on the release.
      - name: Label the AppImage with the base it was built on
        if: matrix.suffix != ''
        run: |
          cd src-tauri/target/release/bundle/appimage
          for f in *.AppImage; do mv "$f" "${f%.AppImage}${{ matrix.suffix }}.AppImage"; done
          ls -la

      # The .deb and .rpm were produced all along and discarded before they were published here.
      # They're worth shipping on their own merit: a native package links against the *host's*
      # WebKitGTK and GLib rather than carrying its own, so it can't drift from the host at all.
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: minigit2-linux-${{ matrix.base }}
          path: ${{ matrix.release_files }}

      - name: Attach Linux artifacts to release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          # This creates the tag (pointing at the triggering commit) as part of creating the
          # release when it doesn't already exist — the runner's own token can do this even when
          # a contributor's own git credentials aren't allowed to push tags directly.
          tag_name: ${{ needs.determine-tag.outputs.tag }}
          files: ${{ matrix.release_files }}

  build-windows:
    needs: determine-tag
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/verify

      - name: Build server sidecar
        shell: bash
        run: ./packaging/windows/build-sidecar.sh

      # Verifies the Node SEA binary actually runs on Windows, not just that it compiled — this
      # is the one step of the whole pipeline with no Linux equivalent to fall back on, so it's
      # worth confirming directly rather than trusting the build succeeding alone.
      - name: Smoke test the sidecar binary
        shell: bash
        run: |
          ./src-tauri/binaries/minigit2-server-x86_64-pc-windows-msvc.exe &
          server_pid=$!
          ok=""
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4300/api/health > /dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          kill "$server_pid" 2>/dev/null || true
          if [ -z "$ok" ]; then
            echo "sidecar did not respond to /api/health within timeout" >&2
            exit 1
          fi
          echo "sidecar smoke test passed"

      - name: Build Tauri installer
        run: npx tauri build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: minigit2-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Attach installers to release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.determine-tag.outputs.tag }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
