name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Override the release tag (e.g. v0.2.0-hotfix). Leave empty to use "v" + the version
          from package.json — the normal way to cut a release: bump package.json, merge, then
          run this workflow.
        required: false

jobs:
  # Shared across both build jobs so they always attach to the exact same tag/release rather
  # than each recomputing it independently — a pure function of the same inputs either way, but
  # one source of truth is one less thing to keep in sync as this file changes.
  determine-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Determine release tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            version=$(grep -m1 '"version"' package.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi

  build-appimage:
    needs: determine-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libayatana-appindicator3-dev \
            patchelf

      - uses: ./.github/actions/verify

      - name: Build server sidecar
        run: ./packaging/linux/build-sidecar.sh

      - name: Build Tauri AppImage
        run: npx tauri build

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: minigit2-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Attach AppImage to release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          # This creates the tag (pointing at the triggering commit) as part of creating the
          # release when it doesn't already exist — the runner's own token can do this even when
          # a contributor's own git credentials aren't allowed to push tags directly.
          tag_name: ${{ needs.determine-tag.outputs.tag }}
          files: src-tauri/target/release/bundle/appimage/*.AppImage

  build-windows:
    needs: determine-tag
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/verify

      - name: Build server sidecar
        shell: bash
        run: ./packaging/windows/build-sidecar.sh

      # Verifies the Node SEA binary actually runs on Windows, not just that it compiled — this
      # is the one step of the whole pipeline with no Linux equivalent to fall back on, so it's
      # worth confirming directly rather than trusting the build succeeding alone.
      - name: Smoke test the sidecar binary
        shell: bash
        run: |
          ./src-tauri/binaries/minigit2-server-x86_64-pc-windows-msvc.exe &
          server_pid=$!
          ok=""
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4300/api/health > /dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          kill "$server_pid" 2>/dev/null || true
          if [ -z "$ok" ]; then
            echo "sidecar did not respond to /api/health within timeout" >&2
            exit 1
          fi
          echo "sidecar smoke test passed"

      - name: Build Tauri installer
        run: npx tauri build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minigit2-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Attach installers to release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-tag.outputs.tag }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
