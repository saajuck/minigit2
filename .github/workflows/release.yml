name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Tag to create and publish a release for (e.g. v0.1.0). Leave empty to just build and
          upload the AppImage as a workflow artifact, without creating a release.
        required: false

jobs:
  build-appimage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libayatana-appindicator3-dev \
            patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm run test

      - name: Build server and client
        run: npm run build

      - name: Build server sidecar
        run: ./packaging/linux/build-sidecar.sh

      - name: Build Tauri AppImage
        run: npx tauri build

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: minigit2-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Attach AppImage to release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          # On a tag push, github.ref_name is already the tag (e.g. "v0.1.0"). On a manual
          # dispatch with a version input, this creates that tag (pointing at the triggering
          # commit) as part of creating the release — the runner's own token can do this even
          # when a contributor's own git credentials aren't allowed to push tags directly.
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: src-tauri/target/release/bundle/appimage/*.AppImage
